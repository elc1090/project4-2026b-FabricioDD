<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Mapa de Reciclagem</title>
    
    <!-- 1. IMPORTAÇÃO DA BIBLIOTECA DO GOOGLE -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; margin-top: 50px; }
        .login-box { border: 1px solid #ccc; padding: 20px; border-radius: 8px; width: 300px; }
        input { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background-color: #218838; }
        #mensagem { color: red; margin-top: 10px; font-size: 14px; text-align: center; }
        .links { margin-top: 15px; text-align: center; font-size: 14px; }
        .links a { color: #007bff; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
        
        /* Estilos para o divisor visual */
        .divisor { text-align: center; margin: 20px 0; color: #888; font-size: 14px; position: relative; }
        .divisor::before, .divisor::after { content: ""; position: absolute; top: 50%; width: 40%; height: 1px; background-color: #ddd; }
        .divisor::before { left: 0; }
        .divisor::after { right: 0; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Entrar no Sistema</h2>
    <form id="formLogin">
        <label for="email">E-mail</label>
        <input type="email" id="email" required>
        
        <label for="senha">Senha</label>
        <input type="password" id="senha" required>
        
        <button type="submit">Entrar</button>
    </form>
    <div id="mensagem"></div>

    <!-- 2. DIVISOR E CONTAINER DO BOTÃO DO GOOGLE -->
    <div class="divisor">ou</div>
    <div id="buttonDiv" style="display: flex; justify-content: center;"></div>

    <div class="links">
        Não tem uma conta? <a href="cadastro.html">Cadastre-se aqui</a>
    </div>
</div>

<script>
    // ==========================================
    // LÓGICA DO LOGIN TRADICIONAL
    // ==========================================
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha').value;
        const divMensagem = document.getElementById('mensagem');

        try {
            const resposta = await fetch('https://project3-2026b-fabriciodd.onrender.com/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, senha: senha })
            });

            const dados = await resposta.json();

            if (resposta.ok) {
                localStorage.setItem('token', dados.token);
                localStorage.setItem('usuarioNome', dados.usuario.nome);
                window.location.href = 'index.html';
            } else {
                divMensagem.innerText = dados.erro;
            }
        } catch (erro) {
            divMensagem.innerText = 'Erro ao conectar com o servidor.';
        }
    });

    // ==========================================
    // 3. LÓGICA DO LOGIN COM GOOGLE
    // ==========================================
    
    // Função chamada automaticamente pelo Google quando o usuário clica e aprova
    async function handleCredentialResponse(response) {
        const divMensagem = document.getElementById('mensagem');
        
        try {
            // Envia a credencial do Google para a nova rota que criamos no Node.js
            const resposta = await fetch('https://project3-2026b-fabriciodd.onrender.com/api/login/google', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ credential: response.credential })
            });

            const dados = await resposta.json();

            if (resposta.ok) {
                // Guarda o nosso token padrão e vai para o mapa!
                localStorage.setItem('token', dados.token);
                localStorage.setItem('usuarioNome', dados.usuario.nome);
                window.location.href = 'index.html';
            } else {
                divMensagem.innerText = dados.erro || 'Erro ao autenticar com o Google.';
            }
        } catch (erro) {
            divMensagem.innerText = 'Erro ao conectar com o servidor.';
        }
    }

    // Inicializa a interface do Google assim que a página carrega
    window.onload = function () {
        google.accounts.id.initialize({
            client_id: "1049551927137-j9a6p24hrilg1m6ba521s8kbvo0nal7c.apps.googleusercontent.com",
            callback: handleCredentialResponse
        });
        
        // Renderiza o botão dentro daquela div id="buttonDiv"
        google.accounts.id.renderButton(
            document.getElementById("buttonDiv"),
            { theme: "outline", size: "large", width: 260 } 
        );
        
        // Mostra aquele balãozinho pop-up automático no canto da tela
        google.accounts.id.prompt(); 
    };
</script>

</body>
</html>
